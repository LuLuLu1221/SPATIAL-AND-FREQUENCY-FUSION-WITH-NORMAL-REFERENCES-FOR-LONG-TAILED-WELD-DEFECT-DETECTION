__include__: [
  'zhwk_unwrapped_150px_cyclic_tiles_detection.yml',
  '../third_party/D-FINE/configs/runtime.yml',
  '../third_party/D-FINE/configs/dfine/include/dataloader.yml',
  '../third_party/D-FINE/configs/dfine/include/optimizer.yml',
  '../third_party/D-FINE/configs/dfine/include/dfine_hgnetv2.yml',
]

# New unwrapped weld-bead run after diagnosis:
# - C1 annulus is unwrapped into a 4000-ish x 150 strip.
# - The radial height is kept at the original 150 px instead of being stretched.
# - Because D-FINE/HGNetv2 needs stride-compatible feature sizes, the dataset
#   copy pads each tile from 1024 x 150 to 1024 x 160. This is padding, not
#   radial resampling.
# - Cyclic 1024 x 150 windows use 25% overlap so the head/tail seam stays continuous.
# - Empty tiles are similarity-pruned to 0.5 per positive tile to reduce repeated
#   all-negative mini-batches.
output_dir: ../../../zhwk_runs/dfine_s_unwrapped_150px_cyclic_tiles_20260826_seed0_r1
use_amp: False
checkpoint_freq: 1
eval_spatial_size: [160, 1024]

DFINE:
  backbone: HGNetv2

HGNetv2:
  name: 'B0'
  return_idx: [1, 2, 3]
  freeze_at: -1
  freeze_norm: False
  use_lab: True

DFINETransformer:
  num_layers: 3
  eval_idx: -1

HybridEncoder:
  in_channels: [256, 512, 1024]
  hidden_dim: 256
  depth_mult: 0.34
  expansion: 0.5

# Fresh fine-tuning from the previous unwrapped model. This is not a resume:
# the data geometry, empty-tile sampling, and reachable LR milestones changed.
epochs: 32
optimizer:
  type: AdamW
  params:
    - params: '^(?=.*backbone)(?!.*norm|bn).*$'
      lr: 0.00005
    - params: '^(?=.*backbone)(?=.*norm|bn).*$'
      lr: 0.00005
      weight_decay: 0.
    - params: '^(?=.*(?:encoder|decoder))(?=.*(?:norm|bn|bias)).*$'
      weight_decay: 0.
  lr: 0.0001
  betas: [0.9, 0.999]
  weight_decay: 0.0001

lr_scheduler:
  type: MultiStepLR
  milestones: [20, 28]
  gamma: 0.1

train_dataloader:
  total_batch_size: 4
  num_workers: 0
  dataset:
    transforms:
      type: Compose
      ops:
        - {type: RandomPhotometricDistort, p: 0.5}
        - {type: RandomHorizontalFlip}
        - {type: SanitizeBoundingBoxes, min_size: 1}
        - {type: ConvertPILImage, dtype: 'float32', scale: True}
        - {type: ConvertBoxes, fmt: 'cxcywh', normalize: True}
      policy:
        name: stop_epoch
        epoch: 32
        ops: []
  collate_fn:
    type: BatchImageCollateFunction
    base_size: [160, 1024]
    base_size_repeat: ~
    stop_epoch: 32
    ema_restart_decay: 0.9999

val_dataloader:
  total_batch_size: 4
  num_workers: 0
  dataset:
    transforms:
      type: Compose
      ops:
        - {type: ConvertPILImage, dtype: 'float32', scale: True}
  collate_fn:
    type: BatchImageCollateFunction
    base_size: [160, 1024]
    base_size_repeat: ~
